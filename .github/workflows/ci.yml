# Automatic qualification moved to GitLab CI to avoid consuming GitHub Actions quota.
# This workflow is retained as an explicit manual fallback only.
name: cloud-studio-ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run verify
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-studio-vsix-${{ runner.os }}
          path: artifacts/*.vsix*
  native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python scripts/package.py
      - run: npm install --prefix .ci-tools --no-save --package-lock=false @vscode/test-electron@2.5.2
      - run: xvfb-run -a npm run test:vscode
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-studio-ui-evidence
          path: artifacts/
